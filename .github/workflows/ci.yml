name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend Lint, Migrations & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Lint with ruff
        run: ruff check app tests migrations

      - name: Run Alembic migrations on isolated SQLite database
        env:
          DATABASE_URL: sqlite:///isolated_test.db
        run: alembic upgrade head

      - name: Run pytest test suite
        env:
          DATABASE_URL: sqlite:///isolated_test.db
        run: pytest

  frontend:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Typecheck with TypeScript
        run: npm run typecheck

      - name: Run unit tests with Vitest
        run: npx vitest run

      - name: Production build
        run: npm run build
